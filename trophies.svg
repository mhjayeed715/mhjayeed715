<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="S. M. Mehrab Hossain Jayeed - Achievement Trophies">
<title>Achievement Trophies &amp; Milestones</title>
<desc>Interactive developer milestone trophies displaying showcase awards, academic honors, shipped apps, and coding velocity.</desc>
<defs>
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Inter:wght@600;700;800&display=swap');
text {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.mono {
  font-family: 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
}
@keyframes popCell {
  0% { opacity: 0; transform: translateY(16px) scale(.88); }
  70% { opacity: 1; transform: translateY(-3px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes rankGlow {
  0%, 100% { opacity: .75; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}
@keyframes shineX2 {
  0% { transform: translateX(-240px) skewX(-15deg); }
  55%, 100% { transform: translateX(1200px) skewX(-15deg); }
}
.cell {
  opacity: 0;
  animation: popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;
  transform-box: fill-box;
  transform-origin: center;
}
.rk {
  animation: rankGlow 2.2s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.sh2 {
  animation: shineX2 5.5s ease-in-out 1.8s infinite;
}
]]></style>
<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".12"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="tc">
  <rect x="0" y="0" width="1092" height="168" rx="16"/>
</clipPath>
</defs>

  <!-- Cell 1: Showcase Award (Gold / Amber) -->
  <g class="cell" style="animation-delay:0.20s">
    <rect x="12" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#fbbf24" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="96" y="52" text-anchor="middle" font-size="30">🏆</text>
    <text class="rk mono" x="166" y="40" text-anchor="end" font-size="23" font-weight="700" fill="#fbbf24" style="animation-delay:0.60s">SSS</text>
    <text x="96" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Showcase 2026</text>
    <text x="96" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">2nd Place Winner</text>
    <rect x="28" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="28" y="124" width="0" height="5" rx="2.5" fill="#fbbf24">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="0.55s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Cell 2: Academic Honors (Cyan / Blue) -->
  <g class="cell" style="animation-delay:0.38s">
    <rect x="192" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="276" y="52" text-anchor="middle" font-size="30">🎓</text>
    <text class="rk mono" x="346" y="40" text-anchor="end" font-size="23" font-weight="700" fill="#38bdf8" style="animation-delay:0.78s">SSS</text>
    <text x="276" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Academic Honors</text>
    <text x="276" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">CGPA 3.93 / 4.00</text>
    <rect x="208" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="208" y="124" width="0" height="5" rx="2.5" fill="#38bdf8">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="0.73s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Cell 3: Mobile Architecture (Indigo / Violet) -->
  <g class="cell" style="animation-delay:0.56s">
    <rect x="372" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="456" y="52" text-anchor="middle" font-size="30">📱</text>
    <text class="rk mono" x="526" y="40" text-anchor="end" font-size="26" font-weight="700" fill="#818cf8" style="animation-delay:0.96s">S</text>
    <text x="456" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Mobile Architect</text>
    <text x="456" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">Flutter &amp; Dart</text>
    <rect x="388" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="388" y="124" width="0" height="5" rx="2.5" fill="#818cf8">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="0.91s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Cell 4: Production Shipped (Emerald) -->
  <g class="cell" style="animation-delay:0.74s">
    <rect x="552" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#34d399" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="636" y="52" text-anchor="middle" font-size="30">🚀</text>
    <text class="rk mono" x="706" y="40" text-anchor="end" font-size="26" font-weight="700" fill="#34d399" style="animation-delay:1.14s">S</text>
    <text x="636" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">System Builder</text>
    <text x="636" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">9+ Shipped MVPs</text>
    <rect x="568" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="568" y="124" width="0" height="5" rx="2.5" fill="#34d399">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="1.09s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Cell 5: Coding Velocity (Sky Cyan) -->
  <g class="cell" style="animation-delay:0.92s">
    <rect x="732" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="816" y="52" text-anchor="middle" font-size="30">⚡</text>
    <text class="rk mono" x="886" y="40" text-anchor="end" font-size="26" font-weight="700" fill="#22d3ee" style="animation-delay:1.32s">A</text>
    <text x="816" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Code Velocity</text>
    <text x="816" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">3+ Years Coding</text>
    <rect x="748" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="748" y="124" width="0" height="5" rx="2.5" fill="#22d3ee">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="1.27s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Cell 6: Repo Creator (Rose / Ruby) -->
  <g class="cell" style="animation-delay:1.10s">
    <rect x="912" y="12" width="168" height="144" rx="14" fill="#13182e" stroke="#f43f5e" stroke-opacity=".5" stroke-width="1.3"/>
    <text x="996" y="52" text-anchor="middle" font-size="30">📦</text>
    <text class="rk mono" x="1066" y="40" text-anchor="end" font-size="26" font-weight="700" fill="#f43f5e" style="animation-delay:1.50s">A</text>
    <text x="996" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Repo Creator</text>
    <text x="996" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#94a3b8">20+ Public Repos</text>
    <rect x="928" y="124" width="136" height="5" rx="2.5" fill="#1e243d"/>
    <rect x="928" y="124" width="0" height="5" rx="2.5" fill="#f43f5e">
      <animate attributeName="width" from="0" to="136" dur="1s" begin="1.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Holographic Sweep Beam -->
  <g clip-path="url(#tc)">
    <rect class="sh2" x="0" y="0" width="160" height="168" fill="url(#shg2)"/>
  </g>
</svg>
